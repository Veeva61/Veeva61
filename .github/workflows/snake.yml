# Draws a snake eating the contribution graph and publishes it to the "output" branch.
name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8e7cc3&color_dots=#ebedf0,#e4dcff,#c9b8ff,#a690e8,#7a63c9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e8e0ff&color_dots=#2b2838,#3f3660,#6a5aa8,#a08ce0,#d9ceff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
